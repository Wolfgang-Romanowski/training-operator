apiVersion: monitoring.rhobs/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: training-operator-alerts
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: alerting
spec:
  route:
    groupBy: ['alertname', 'cluster', 'service']
    groupWait: 10s
    groupInterval: 10s
    repeatInterval: 12h
    receiver: 'training-operator-team'
    routes:
    - match:
        severity: critical
      receiver: 'training-operator-oncall'
  
  receivers:
  - name: 'training-operator-team'
    webhookConfigs:
    - url: 'https://webhook.site/training-operator-team'  # Replace with real webhook
      sendResolved: true
  
  - name: 'training-operator-oncall'
    webhookConfigs:
    - url: 'https://pagerduty.redhat.com/training-operator'  # Replace with real PagerDuty
      sendResolved: true