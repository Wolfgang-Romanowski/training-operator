# manifests/base/monitoring/deployment-metrics-patch.yaml
# Patch to add annotations for otel-collector scraping
apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-operator
spec:
  template:
    metadata:
      annotations:
        # IMPORTANT: Metrics are scraped ONLY by OTEL collector, NOT directly by Prometheus
        # This prevents duplicate scraping per RHOAISTRAT-575 federation architecture
        # The OTEL collector uses kubernetes_sd_configs to discover pods based on labels
        # NOT these prometheus.io annotations (which would cause duplicate scraping)
    spec:
      containers:
      - name: manager
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP