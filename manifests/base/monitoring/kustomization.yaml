# manifests/base/monitoring/kustomization.yaml
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Original training-operator metrics service (still needed for health checks)
  - service.yaml
  
  # OpenTelemetry Collector resources (REQUIRED by RHOAISTRAT-575)
  - opentelemetrycollector.yaml
  - otel-collector-rbac.yaml
  - otel-collector-service.yaml
  - otel-collector-config.yaml
  - otel-collector-networkpolicy.yaml
  
  # ServiceMonitor now scrapes otel-collector, not training-operator
  - servicemonitor.yaml
  
  # Recording rules in openshift-monitoring namespace
  - prometheusrule.yaml
  
  # Network policies
  - networkpolicy.yaml

patches:
  # Add metrics annotations to deployment
  - path: deployment-metrics-patch.yaml
    target:
      kind: Deployment
      name: training-operator

commonLabels:
  app.kubernetes.io/name: training-operator
  app.kubernetes.io/part-of: training-operator
  monitoring.opendatahub.io/scrape: "true"