# manifests/base/monitoring/kustomization.yaml
# REDESIGNED: Clean OTEL-first architecture per RHOAISTRAT-575
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  # Core OpenTelemetry components (RHOAISTRAT-575 primary architecture)
  - opentelemetrycollector.yaml
  - otel-collector-rbac.yaml
  - otel-collector-service.yaml
  - otel-collector-networkpolicy.yaml
  
  # Metrics collection and processing
  - training-operator-servicemonitor.yaml
  - prometheusrule.yaml
  
  # Observability UI integration per documentation
  - observability-ui-plugins.yaml

patches:
  # Add metrics annotations to deployment
  - path: deployment-metrics-patch.yaml
    target:
      kind: Deployment
      name: training-operator

commonLabels:
  app.kubernetes.io/name: training-operator
  app.kubernetes.io/part-of: training-operator
  monitoring.opendatahub.io/scrape: "true"