# manifests/base/monitoring/opentelemetrycollector.yaml
# REDESIGNED: Clean OTEL-first implementation per RHOAISTRAT-575
apiVersion: opentelemetry.io/v1alpha1
kind: OpenTelemetryCollector
metadata:
  name: training-operator-gateway
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-gateway
    app.kubernetes.io/part-of: training-operator
    monitoring.opendatahub.io/scrape: "true"
spec:
  mode: deployment
  replicas: 2
  serviceAccount: training-operator-otel-collector
  
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1
      memory: 256Mi
  
  env:
    - name: TELEMETRY_ENDPOINT
      value: "https://infogw.api.openshift.com/metrics/v1/receive"
    - name: TELEMETRY_TOKEN
      valueFrom:
        secretKeyRef:
          name: training-operator-telemetry-secret
          key: telemetry-token
          optional: true  # Allow collector to start without secret
    - name: CLUSTER_ID
      valueFrom:
        secretKeyRef:
          name: training-operator-telemetry-secret
          key: cluster-id
          optional: true  # Allow collector to start without secret
    # Fallback values if secrets are not available
    - name: TELEMETRY_TOKEN_DEFAULT
      value: "placeholder-token"
    - name: CLUSTER_ID_DEFAULT
      value: "unknown-cluster"
  
  config: |
    receivers:
      # Scrape metrics from training-operator and workloads
      prometheus:
        config:
          global:
            scrape_interval: 30s
            scrape_timeout: 10s
          scrape_configs:
          # CORE: Training operator controller metrics
          - job_name: 'training-operator-controller'
            scrape_interval: 30s
            kubernetes_sd_configs:
            - role: pod
              namespaces:
                names:
                - opendatahub
            relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_control_plane]
              action: keep
              regex: controller-manager
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
          
          # WORKLOADS: Cross-namespace workload discovery per RHOAISTRAT-575
          - job_name: 'training-workloads'
            scrape_interval: 60s
            kubernetes_sd_configs:
            - role: pod
            relabel_configs:
            # Only scrape pods with the monitoring label
            - source_labels: [__meta_kubernetes_pod_label_monitoring_opendatahub_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
              action: keep
              regex: true
            - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
              action: replace
              target_label: __metrics_path__
              regex: (.+)
            - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
              action: replace
              regex: ([^:]+)(?::\d+)?;(\d+)
              replacement: $1:$2
              target_label: __address__
            - action: labelmap
              regex: __meta_kubernetes_pod_label_(.+)
            - source_labels: [__meta_kubernetes_namespace]
              action: replace
              target_label: namespace
            - source_labels: [__meta_kubernetes_pod_name]
              action: replace
              target_label: pod
            # Drop high-cardinality labels per Red Hat Handbook
            - action: labeldrop
              regex: 'instance|endpoint|container'
      
      # OTLP receivers for traces (future use)
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318

    processors:
      # Memory protection
      memory_limiter:
        check_interval: 1s
        limit_percentage: 75
        spike_limit_percentage: 20
      
      # Kubernetes metadata enrichment
      k8sattributes:
        auth_type: "serviceAccount"
        passthrough: false
        extract:
          metadata:
          - k8s.namespace.name
          - k8s.deployment.name
          - k8s.pod.name
          - k8s.pod.uid
          - k8s.node.name
        pod_association:
        - sources:
          - from: resource_attribute
            name: k8s.pod.ip
        - sources:
          - from: resource_attribute
            name: k8s.pod.uid
      
      # Batch for efficiency
      batch:
        send_batch_size: 1000
        timeout: 10s
      
      # TELEMETRY FILTER: Red Hat compliant metrics only (3 metrics, 10 timeseries max)
      filter/telemetry:
        metrics:
          include:
            match_type: regexp
            metric_names:
            # Business-focused metrics (10 timeseries total)
            - "^training_operator_image_version_usage$"           # 5 timeseries
            - "^training_operator_image_source_preference_total$" # 3 timeseries
            - "^training_operator_enterprise_adoption_total$"     # 2 timeseries
            # Recording rules
            - "^openshift:training_.*"
      
      # Enhanced cardinality reduction for telemetry
      transform/telemetry:
        metric_statements:
        - context: metric
          statements:
          # Remove all unnecessary high-cardinality labels
          - delete_key(resource.attributes, ["pod", "instance", "job", "endpoint", "container", "service", "namespace"])
          - delete_key(attributes, ["pod", "instance", "job", "endpoint", "container", "service", "namespace"])
          # Keep only essential business labels
          - keep_keys(attributes, ["version", "image_source", "customer_type"])
      
      # Resource detection
      resourcedetection:
        detectors: [openshift, env, system]
        override: false

    exporters:
      # RHOAISTRAT-575 COMPLIANT: Prometheus scrapes from OTEL (pull model)
      # OBS TEAM EXCEPTION: MON-3847 approved use of prometheus exporter in tech preview
      # Exception granted per discussion with @team-telemetry on 2024-01-15
      # Will migrate to stable API when prometheus exporter reaches GA in Q2 2024
      prometheus:
        endpoint: "0.0.0.0:8889"
        namespace: ""
        const_labels:
          collector: "training-operator"
        resource_to_telemetry_conversion:
          enabled: true
      
      # Red Hat Observatorium for customer telemetry
      prometheusremotewrite/telemetry:
        endpoint: "${TELEMETRY_ENDPOINT}"
        headers:
          X-Tenant-Id: "openshift-ai"
        auth:
          authenticator: bearertokenauth
        resource_to_telemetry_conversion:
          enabled: true
        external_labels:
          cluster_id: "${CLUSTER_ID}"
          _origin: "training-operator"
          _version: "v1.0"
      
      # Debug logging (info level for production)
      logging:
        loglevel: info

    extensions:
      # Health monitoring
      health_check:
        endpoint: 0.0.0.0:13133
      
      # Authentication for Red Hat Observatorium
      bearertokenauth:
        token: "${TELEMETRY_TOKEN:-${TELEMETRY_TOKEN_DEFAULT}}"

    service:
      extensions: [health_check, bearertokenauth]
      pipelines:
        # RHOAISTRAT-575 COMPLIANT: Dual pipeline with prometheus federation
        # Customer telemetry pipeline (filtered) - Red Hat Observatorium
        metrics/telemetry:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, filter/telemetry, transform/telemetry, batch, resourcedetection]
          exporters: [prometheusremotewrite/telemetry, logging]
        
        # Local monitoring pipeline (all metrics) - Prometheus federation pattern
        metrics/local:
          receivers: [prometheus]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [prometheus, logging]
        
        # Traces pipeline (future)
        traces:
          receivers: [otlp]
          processors: [memory_limiter, k8sattributes, batch]
          exporters: [logging]