# manifests/base/monitoring/otel-collector-config.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: training-operator-telemetry-config
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: telemetry
data:
  # Telemetry endpoint configuration
  telemetry.yaml: |
    # Red Hat Observatorium endpoint for telemetry
    telemetry:
      endpoint: "https://infogw.api.openshift.com/metrics/v1/receive"
      tenant: "openshift-ai-training"
      # Token will be injected from secret
    
    # Customer export configuration (optional)
    customer_export:
      enabled: false
      endpoint: ""
      auth_type: "api_key"
    
    # Metric filters for telemetry
    telemetry_metrics:
      # Only these recording rules go to telemetry
      allowed:
        - "openshift:training_rhoai_adoption_percentage"
        - "openshift:training_job_success_rate"
        - "openshift:training_active_jobs_total"
      
      # Aggregation rules for raw metrics
      aggregations:
        - metric: "training_jobs_by_image_source_total"
          group_by: ["image_source"]
          operation: "sum"
        - metric: "training_jobs_completed_total"
          group_by: ["status"]
          operation: "sum"
---
apiVersion: v1
kind: Secret
metadata:
  name: training-operator-telemetry-secret
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: telemetry
type: Opaque
stringData:
  # This token comes from the cluster pull secret
  telemetry-token: "${TELEMETRY_TOKEN}"
  # Cluster ID for telemetry
  cluster-id: "${CLUSTER_ID}"