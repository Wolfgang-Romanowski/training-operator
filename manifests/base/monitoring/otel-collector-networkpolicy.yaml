# manifests/base/monitoring/otel-collector-networkpolicy.yaml
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-network-policy
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/component: telemetry-gateway
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: opentelemetry-collector
      app.kubernetes.io/instance: training-operator-gateway
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow Prometheus to scrape otel-collector
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: redhat-ods-monitoring
    ports:
    - protocol: TCP
      port: 8889  # Prometheus exporter port
  
  # Allow from openshift-monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: openshift-monitoring
    ports:
    - protocol: TCP
      port: 8889
  
  # Allow OTLP from any pod in opendatahub namespace
  - from:
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 4317  # OTLP gRPC
    - protocol: TCP
      port: 4318  # OTLP HTTP
  
  egress:
  # Allow scraping training-operator pods
  - to:
    - podSelector:
        matchLabels:
          control-plane: controller-manager
    ports:
    - protocol: TCP
      port: 8080
  
  # Allow DNS
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
  
  # Allow telemetry export to Observatorium
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 443  # HTTPS for telemetry
---
# Update NetworkPolicy for training-operator to allow otel-collector
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-otel-scraping
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
  policyTypes:
  - Ingress
  ingress:
  # Allow otel-collector to scrape metrics
  - from:
    - podSelector:
        matchLabels:
          app.kubernetes.io/component: opentelemetry-collector
    ports:
    - protocol: TCP
      port: 8080