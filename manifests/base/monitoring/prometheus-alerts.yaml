apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: training-operator-alerts
  namespace: opendatahub
  labels:
    monitoring.opendatahub.io/scrape: "true"
    prometheus: kube-prometheus
spec:
  groups:
  - name: training_operator.alerts
    interval: 30s
    rules:
    - alert: TrainingOperatorLowRHOAIAdoption
      expr: |
        openshift:training_rhoai_adoption_percentage < 50
      for: 1h
      labels:
        severity: warning
        team: rhoai-platform
      annotations:
        summary: "RHOAI adoption below 50%"
        description: "Only {{ $value }}% of training jobs are using RHOAI images"
        
    - alert: TrainingOperatorHighFailureRate
      expr: |
        openshift:training_job_success_rate < 90
      for: 15m
      labels:
        severity: critical
        team: rhoai-platform
      annotations:
        summary: "Training job success rate below 90%"
        description: "Success rate is {{ $value }}%"