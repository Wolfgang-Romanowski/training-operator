# manifests/base/monitoring/prometheusrule.yaml
# CONSOLIDATED: All recording rules and alerts for training-operator telemetry
# Compliant with Red Hat Monitoring Handbook and RHOAISTRAT-575
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: training-operator-recording-rules
  namespace: openshift-monitoring  # REQUIRED: Must be in openshift-monitoring per Red Hat Handbook
  labels:
    monitoring.opendatahub.io/scrape: "true"
    prometheus: kube-prometheus
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: telemetry
spec:
  groups:
  - name: training_operator.telemetry
    interval: 30s
    rules:
    # =========================================================
    # RED HAT COMPLIANT RECORDING RULES (10 timeseries max)
    # Business-focused metrics for deprecation and adoption decisions
    # =========================================================
    
    # PRE-AGGREGATION: Remove high-cardinality labels before telemetry export
    # These rules ensure we stay within Red Hat's 10 timeseries limit
    
    # Aggregate version usage removing pod/instance/namespace labels
    - record: training:image_version_usage_aggregated
      expr: |
        sum without (pod, instance, namespace, job, endpoint) (
          training_operator_image_version_usage
        )
    
    # Aggregate source preference removing all high-cardinality labels  
    - record: training:image_source_preference_aggregated
      expr: |
        sum without (pod, instance, namespace, job, endpoint) (
          rate(training_operator_image_source_preference_total[5m])
        )
    
    # Aggregate enterprise adoption removing all high-cardinality labels
    - record: training:enterprise_adoption_aggregated
      expr: |
        sum without (pod, instance, namespace, job, endpoint) (
          rate(training_operator_enterprise_adoption_total[5m])
        )
    
    # METRIC 1: Version Deprecation Analysis
    # Business Question: Can we deprecate PyTorch 2.4 or TensorFlow 2.14?
    - record: openshift:training_version_deprecation_analysis
      expr: |
        sum by (version) (training:image_version_usage_aggregated{version=~"pytorch-2\\.[34]|tensorflow-2\\.1[45]|other"})
    
    # METRIC 2: RHOAI Adoption Rate
    # Business Question: What % of jobs use RHOAI official images?
    - record: openshift:training_rhoai_adoption_rate
      expr: |
        (
          sum(training:image_source_preference_aggregated{image_source="rhoai_official"})
          /
          sum(training:image_source_preference_aggregated)
        ) * 100 or vector(0)
    
    # METRIC 3: Enterprise vs Non-Enterprise Split
    # Business Question: Are enterprise customers adopting RHOAI?
    - record: openshift:training_enterprise_percentage
      expr: |
        (
          sum(training:enterprise_adoption_aggregated{customer_type="enterprise"})
          /
          sum(training:enterprise_adoption_aggregated)
        ) * 100 or vector(0)

  - name: training_operator.alerts
    interval: 30s
    rules:
    # Business-focused alerts for product decisions
    - alert: TrainingOperatorOldVersionHighUsage
      expr: |
        training_operator_image_version_usage{version=~"pytorch-2.[34]|tensorflow-2.1[45]"} > 10
      for: 24h
      labels:
        severity: info
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "High usage of old runtime version {{ $labels.version }}"
        description: "Version {{ $labels.version }} has {{ $value }} active jobs - consider delaying deprecation"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#old-version-high-usage"
        
    - alert: TrainingOperatorLowRHOAIAdoption
      expr: |
        openshift:training_rhoai_adoption_rate < 30
      for: 12h
      labels:
        severity: info
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Low RHOAI runtime adoption"
        description: "Only {{ $value | humanizePercentage }} of jobs use RHOAI official images"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#low-rhoai-adoption"
        
    - alert: TrainingOperatorNoEnterpriseAdoption
      expr: |
        openshift:training_enterprise_percentage < 10
      for: 24h
      labels:
        severity: warning
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Very low enterprise adoption"
        description: "Only {{ $value | humanizePercentage }} of usage is from enterprise customers"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#no-enterprise-adoption"
    
    # Operational alerts for system health
    - alert: TrainingOperatorTelemetryDown
      expr: |
        up{job="training-operator-otel-collector"} == 0
      for: 5m
      labels:
        severity: warning
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Training operator telemetry collection is down"
        description: "OTEL collector for training operator metrics is not responding for 5 minutes"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#telemetry-down"
        
    - alert: TrainingOperatorHighCardinality
      expr: |
        sum(count by (__name__)({__name__=~"training_operator_.*"})) > 10
      for: 10m
      labels:
        severity: critical
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Training operator metrics exceed cardinality limit"
        description: "Metrics cardinality {{ $value }} exceeds Red Hat limit of 10 timeseries"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#high-cardinality"
    
    - alert: TrainingOperatorTelemetryEndpointFailure
      expr: |
        rate(otelcol_exporter_send_failed_metric_points_total{exporter="otlphttp/telemetry"}[5m]) > 0
      for: 15m
      labels:
        severity: warning
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Telemetry export to Observatorium failing"
        description: "Failed to export {{ $value | humanize }} metrics per second to Red Hat telemetry endpoint"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#telemetry-export-failure"
    
    - alert: TrainingOperatorTelemetryAuthFailure
      expr: |
        increase(otelcol_exporter_send_failed_metric_points_total{exporter="otlphttp/telemetry",error_type="auth"}[5m]) > 0
      for: 5m
      labels:
        severity: critical
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Telemetry authentication failure"
        description: "Authentication to Red Hat Observatorium is failing - check TELEMETRY_TOKEN secret"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#telemetry-auth-failure"
    
    - alert: TrainingOperatorMetricScrapeFailing
      expr: |
        up{job="training-operator-metrics-monitor"} == 0
      for: 10m
      labels:
        severity: warning
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Training operator metrics scraping is failing"
        description: "Prometheus cannot scrape metrics from training-operator pods"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#scrape-failure"
    
    - alert: TrainingOperatorHighMemoryUsage
      expr: |
        container_memory_usage_bytes{pod=~"training-operator-.*"} / container_spec_memory_limit_bytes > 0.9
      for: 10m
      labels:
        severity: warning
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Training operator high memory usage"
        description: "Training operator pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }}"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#high-memory"
    
    - alert: TrainingOperatorVersionSkew
      expr: |
        abs(delta(training_operator_image_version_usage[1h])) > 5
      for: 30m
      labels:
        severity: info
        component: training-operator
        team: rhoai-platform
      annotations:
        summary: "Sudden change in runtime version usage"
        description: "Version {{ $labels.version }} usage changed by {{ $value }} jobs in the last hour"
        runbook_url: "https://github.com/opendatahub-io/training-operator/wiki/alerts#version-skew"