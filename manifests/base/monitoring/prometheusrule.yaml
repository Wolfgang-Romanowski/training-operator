# manifests/base/monitoring/prometheusrule.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: training-operator-recording-rules
  namespace: openshift-monitoring  # MUST be in openshift-monitoring
  labels:
    monitoring.opendatahub.io/scrape: "true"
    prometheus: kube-prometheus
    app.kubernetes.io/name: training-operator
spec:
  groups:
  - name: training_operator.telemetry
    interval: 30s
    rules:
    # =========================================================
    # TELEMETRY RECORDING RULES - LIMITED TO 3 METRICS
    # Compliant with Red Hat Monitoring Handbook
    # =========================================================
    
    # METRIC 1: RHOAI Runtime Adoption Rate
    # Business Question: What percentage of training jobs use RHOAI images?
    # Cardinality: 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Product Management, Executive Dashboard
    - record: openshift:training_rhoai_adoption_percentage
      expr: |
        sum without(instance, pod, endpoint, service, container, framework, version) (
          (
            sum(training_jobs_by_image_source_total{image_source="rhoai_official"})
            /
            (sum(training_jobs_by_image_source_total) > 0)
          ) * 100
        ) or vector(0)
    
    # METRIC 2: Job Success Rate
    # Business Question: What percentage of jobs complete successfully?
    # Cardinality: 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: SRE, Platform Team
    - record: openshift:training_job_success_rate
      expr: |
        sum without(instance, pod, endpoint, service, container, framework, status) (
          (
            sum(training_jobs_completed_total{status="succeeded"})
            /
            (sum(training_jobs_completed_total) > 0)
          ) * 100
        ) or vector(100)
    
    # METRIC 3: Active Training Workloads
    # Business Question: How many training workloads are currently running?
    # Cardinality: 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Capacity Planning, Executive Dashboard
    - record: openshift:training_active_jobs_total
      expr: |
        sum without(instance, pod, endpoint, service, container, framework) (
          sum(training_jobs_active_total)
        ) or vector(0)

  - name: training_operator.alerts
    interval: 30s
    rules:
    - alert: TrainingOperatorHighFailureRate
      expr: |
        openshift:training_job_success_rate < 90
      for: 15m
      labels:
        severity: warning
        component: training-operator
      annotations:
        summary: "Training job success rate below 90%"
        description: "Training job success rate is {{ $value }}%"
        
    - alert: TrainingOperatorLowAdoption
      expr: |
        openshift:training_rhoai_adoption_percentage < 30
      for: 1h
      labels:
        severity: info
        component: training-operator
      annotations:
        summary: "Low RHOAI runtime adoption"
        description: "Only {{ $value }}% of jobs use RHOAI images"