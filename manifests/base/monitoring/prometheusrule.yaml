apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: training-operator-recording-rules
  namespace: opendatahub
  labels:
    monitoring.opendatahub.io/scrape: "true"
    prometheus: kube-prometheus
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/part-of: training-operator
spec:
  groups:
  - name: training_operator.telemetry
    interval: 30s
    rules:
    # =========================================================
    # PHASE 1 RECORDING RULES - Max 10 timeseries for Telemetry
    # Per Red Hat Monitoring Handbook requirements
    # =========================================================
    
    # RULE 1: RHOAI adoption percentage - 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Telemetry, Product Management
    - record: openshift:training_rhoai_adoption_percentage
      expr: |
        (
          sum(training_jobs_by_image_source_total{image_source="rhoai_official"})
          /
          sum(training_jobs_by_image_source_total)
        ) * 100 or on() vector(0)
    
    # RULE 2: Job success rate - 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: SRE, Telemetry
    - record: openshift:training_job_success_rate
      expr: |
        (
          sum(training_jobs_completed_total{status="succeeded"})
          /
          sum(training_jobs_completed_total)
        ) * 100 or on() vector(100)
    
    # RULE 3: GPU hours consumed - 1 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Finance, Product Management
    - record: openshift:training_gpu_hours_daily
      expr: |
        sum(
          increase(training_accelerator_hours_consumed_total[24h])
        ) or on() vector(0)
    
    # RULE 4: Framework distribution - ~6 timeseries
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Product Management
    - record: openshift:training_framework_usage_total
      expr: |
        sum by (framework) (
          training_jobs_created_total
        )
    
    # RULE 5: Kueue adoption rate - 1 timeseries (REQUIRED)
    # owners: (@opendatahub/training-operator-team)
    # consumed-by: Platform Team
    - record: openshift:training_kueue_adoption_rate
      expr: |
        (
          sum(training_kueue_managed_jobs_total)
          /
          sum(training_jobs_created_total)
        ) * 100 or on() vector(0)
    
    # Total Phase 1: ~10 timeseries (at limit)

  - name: training_operator.alerts
    interval: 30s
    rules:
    - alert: TrainingOperatorHighFailureRate
      expr: |
        openshift:training_job_success_rate < 90
      for: 15m
      labels:
        severity: critical
        team: opendatahub
      annotations:
        summary: "Training job success rate below 90%"
        description: "Success rate is {{ $value }}%"
        runbook_url: "https://gitlab.cee.redhat.com/opendatahub/runbooks/-/blob/main/training-operator/high-failure-rate.md"
    
    - alert: TrainingOperatorHighGPUUsage
      expr: |
        openshift:training_gpu_hours_daily > 1000
      for: 30m
      labels:
        severity: warning
        team: opendatahub
      annotations:
        summary: "High GPU usage detected"
        description: "Daily GPU hours: {{ $value }}"