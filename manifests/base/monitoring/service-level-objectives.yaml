# manifests/base/monitoring/service-level-objectives.yaml
apiVersion: sloth.slok.dev/v1
kind: PrometheusServiceLevel
metadata:
  name: training-operator-service-objectives
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: sre-metrics
    monitoring.opendatahub.io/slo: "true"
spec:
  service: "training-operator"
  labels:
    team: "rhoai-platform"
    component: "training"
  slos:
    - name: "job-success-rate-objective"
      objective: 95  # 95% of jobs should succeed
      description: "Training job success rate must exceed 95%"
      sli:
        events:
          error_query: sum(rate(training_jobs_completed_total{status="failed"}[5m]))
          total_query: sum(rate(training_jobs_completed_total[5m]))
      alerting:
        name: TrainingJobSuccessRateBelowTarget
        page_alert:
          labels:
            severity: critical
            team: rhoai-platform
        annotations:
          summary: "Training job success rate below 95% target"
          runbook_url: "https://gitlab.cee.redhat.com/rhoai/runbooks/-/blob/main/training-operator/low-success-rate.md"
          
    - name: "rhoai-adoption-objective"
      objective: 70  # 70% adoption target
      description: "RHOAI runtime adoption should exceed 70%"
      sli:
        raw:
          success_query: |
            (
              sum(training_jobs_by_image_source_total{image_source="rhoai_official"})
              /
              sum(training_jobs_by_image_source_total)
            ) >= 0.7
      alerting:
        name: RHOAIAdoptionBelowTarget
        ticket_alert:
          labels:
            severity: warning
            team: rhoai-platform
        annotations:
          summary: "RHOAI runtime adoption below 70% target"
          description: "Current adoption rate is below our quarterly target"