# manifests/base/monitoring/training-operator-servicemonitor.yaml
# ServiceMonitor to enable Prometheus scraping of OTEL collector metrics
# Per RHOAISTRAT-575 federation pattern requirements
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: training-operator-otel-metrics
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: telemetry
    monitoring.opendatahub.io/scrape: "true"
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: training-operator-otel-collector
      app.kubernetes.io/component: telemetry-gateway
  endpoints:
  - port: prometheus
    scheme: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s
    honorLabels: true  # Important: respect labels from otel-collector
    metricRelabelings:
    # Only keep training_ metrics and recording rules
    - sourceLabels: [__name__]
      regex: '^(training_.*|openshift:training_.*)'
      action: keep
    # Drop any _bucket metrics to reduce cardinality
    - sourceLabels: [__name__]
      regex: '.*_bucket'
      action: drop