apiVersion: v1
kind: Service
metadata:
  # REMOVED prometheus.io annotations per RHOAISTRAT-575
  # Metrics are collected via OTEL collector, not direct Prometheus scraping
  labels:
    app: training-operator
  name: training-operator
spec:
  ports:
    - name: monitoring-port
      port: 8080
      targetPort: 8080
    - name: webhook-server
      port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    control-plane: kubeflow-training-operator
  type: ClusterIP
