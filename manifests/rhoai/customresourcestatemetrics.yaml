apiVersion: v1
kind: ConfigMap
metadata:
  name: training-operator-crsm-config
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: metrics
    app.kubernetes.io/part-of: training-operator
    monitoring.opendatahub.io/scrape: "true"
    monitoring.opendatahub.io/crsm: "true"      
data:
  config.yaml: |
    kind: CustomResourceStateMetrics
    spec:
      resources:
      - groupVersionKind:
          group: kubeflow.org
          version: v1
          kind: PyTorchJob
        metricNamePrefix: training
        labelsFromPath:
          namespace: [metadata, namespace]
          name: [metadata, name]
        metrics:
        - name: "pytorchjob_info"
          help: "PyTorchJob information"
          each:
            type: Info
            info:
              labelsFromPath:
                namespace: [metadata, namespace]
                name: [metadata, name]
        
        - name: "pytorchjob_status_phase"
          help: "PyTorchJob status phase"
          each:
            type: StateSet
            stateSet:
              path: [status, conditions]
              list: [Created, Running, Restarting, Succeeded, Failed]
              labelName: phase
        
        - name: "pytorchjob_start_time_seconds"
          help: "Start time of PyTorchJob in unix timestamp"
          each:
            type: Gauge
            gauge:
              path: [status, startTime]
        
        - name: "pytorchjob_completion_time_seconds"
          help: "Completion time of PyTorchJob in unix timestamp"
          each:
            type: Gauge
            gauge:
              path: [status, completionTime]
      
      - groupVersionKind:
          group: kubeflow.org
          version: v1
          kind: TFJob
        metricNamePrefix: training
        labelsFromPath:
          namespace: [metadata, namespace]
          name: [metadata, name]
        metrics:
        - name: "tfjob_status"
          help: "TFJob status"
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath:
                type: ["type"]
                status: ["status"]
              valueFrom: ["status"]
      
      - groupVersionKind:
          group: kubeflow.org
          version: v1
          kind: MPIJob
        metricNamePrefix: training
        labelsFromPath:
          namespace: [metadata, namespace]
          name: [metadata, name]
        metrics:
        - name: "mpijob_status"
          help: "MPIJob status"
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath:
                type: ["type"]
                status: ["status"]
              valueFrom: ["status"]
      
      - groupVersionKind:
          group: kubeflow.org
          version: v1
          kind: XGBoostJob
        metricNamePrefix: training
        labelsFromPath:
          namespace: [metadata, namespace]
          name: [metadata, name]
        metrics:
        - name: "xgboostjob_status"
          help: "XGBoostJob status"
          each:
            type: Gauge
            gauge:
              path: [status, conditions]
              labelsFromPath:
                type: ["type"]
                status: ["status"]
              valueFrom: ["status"]