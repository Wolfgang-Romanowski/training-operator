# manifests/rhoai/kustomization.yaml
# FIXED: Corrected file references and RHOAI-specific configurations
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: opendatahub
namePrefix: kubeflow-

resources:
  - ../base
  - kubeflow-training-roles.yaml
  - rhoai-monitor-config.yaml        # FIXED: was "monitor.yaml" 
  - customresourcestatemetrics.yaml  # FIXED: was "custom-resource-metrics.yaml"
  - rhoai-telemetry-dashboard.yaml   # FIXED: was "rhoai-adoption-dashboard.yaml"
  - namespace-patch.yaml             # ADDED: ensure cluster-monitoring label

configMapGenerator:
  - name: rhoai-config
    envs:
      - params.env

configurations:
  - params.yaml

replacements:
  - source:
      kind: ConfigMap
      name: rhoai-config
      version: v1
      fieldPath: data.odh-training-operator-controller-image
    targets:
    - select:
        kind: Deployment
        name: training-operator
      fieldPaths:
      - spec.template.spec.containers.0.image

labels:
  - includeSelectors: true
    pairs:
      app.kubernetes.io/component: controller
      app.kubernetes.io/name: training-operator
      app.kubernetes.io/managed-by: rhoai
      monitoring.opendatahub.io/scrape: "true"  # ADDED: consistent labeling

secretGenerator:
  - name: training-operator-telemetry-secret
    options:
      disableNameSuffixHash: true
    literals:
      - telemetry-token=""        # To be filled by RHOAI operator
      - cluster-id=""             # To be filled by RHOAI operator
  - name: training-operator-webhook-cert
    options:
      disableNameSuffixHash: true

patches:
  - path: manager_config_patch.yaml
  - path: manager_metrics_patch.yaml
  # REMOVED: Redundant service port patch - handled by base configuration