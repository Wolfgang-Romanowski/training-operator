apiVersion: apps/v1
kind: Deployment
metadata:
  name: training-operator
spec:
  template:
    spec:
      containers:
      - name: manager
        args:
        - --metrics-bind-address=:8080
        - --telemetry-enabled=true
        - --leader-elect
        ports:
        - containerPort: 8080
          name: metrics
          protocol: TCP
        env:
        - name: TELEMETRY_ENABLED
          value: "true"