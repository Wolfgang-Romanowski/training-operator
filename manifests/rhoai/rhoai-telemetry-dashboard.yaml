# manifests/rhoai/rhoai-telemetry-dashboard.yaml
# RHOAI-specific Perses dashboard for telemetry metrics per RHOAISTRAT-575
apiVersion: perses.dev/v1alpha1
kind: PersesDashboard
metadata:
  name: rhoai-training-operator-telemetry
  namespace: opendatahub
  labels:
    app.kubernetes.io/name: training-operator
    app.kubernetes.io/component: dashboard
    app.kubernetes.io/part-of: training-operator
spec:
  datasource:
    type: prometheus
    name: training-operator-prometheus
  display:
    name: "RHOAI Training Operator - Customer Telemetry"
    description: "Customer usage analytics for RHOAI Training Operator"
  duration: 24h
  refreshInterval: 5m
  panels:
    - kind: TimeSeriesChart
      spec:
        display:
          name: "Runtime Version Deprecation Analysis"
          description: "Track PyTorch and TensorFlow version usage for deprecation decisions"
        queries:
          - expr: openshift:training_version_deprecation_analysis
            legend: "{{version}}"
        legend:
          position: bottom
          
    - kind: PieChart
      spec:
        display:
          name: "RHOAI Runtime Adoption Rate"
          description: "Percentage of jobs using RHOAI official images"
        queries:
          - expr: openshift:training_rhoai_adoption_rate
            legend: "RHOAI Adoption %"
        legend:
          position: right
          
    - kind: BarChart
      spec:
        display:
          name: "Enterprise vs Non-Enterprise Usage"
          description: "Customer segmentation for business decisions"
        queries:
          - expr: openshift:training_enterprise_percentage
            legend: "Enterprise %"
        legend:
          position: bottom
          
    - kind: TimeSeriesChart
      spec:
        display:
          name: "Raw Image Version Usage"
          description: "Active jobs by runtime version"
        queries:
          - expr: training_operator_image_version_usage
            legend: "{{version}}"
        legend:
          position: bottom
          
    - kind: CounterChart
      spec:
        display:
          name: "Image Source Preferences"
          description: "Total jobs by image source over time"
        queries:
          - expr: sum by (image_source) (rate(training_operator_image_source_preference_total[5m]))
            legend: "{{image_source}}"
        legend:
          position: right